plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    //Forgified Fabric API
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:$rootProject.fabric_api_version+$rootProject.forgified_fabric_api_version+$rootProject.minecraft_version"

    //Kotlin for Forge
    implementation "thedarkcolour:kotlinforforge-neoforge:$rootProject.kotlin_forge_version"

    //Cloth Config NeoForge
    implementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    //Hex Casting neoforge
    implementation rootProject.files("libs/hexcasting-neoforge-$rootProject.minecraft_version-${rootProject.hexcasting_version}.jar")


    //RUNTIME DEPENDENCIES

    //Hex Casting runtime dependencies
    /*Kotlin for Forge*/ runtimeOnly "thedarkcolour:kotlinforforge:$rootProject.kotlin_forge_version"
    /*Paucal  * * * * */ runtimeOnly "at.petra-k:paucal:$rootProject.paucal_version+$rootProject.minecraft_version-neoforge"
    /*Patchouli * * * */ runtimeOnly "vazkii.patchouli:Patchouli:$rootProject.minecraft_version-$rootProject.patchouli_version-NEOFORGE-SNAPSHOT"
    /*Caelus API  * * */ runtimeOnly "com.illusivesoulworks.caelus:caelus-neoforge:$rootProject.caelus_version+$rootProject.minecraft_version"
    /*Inline  * * * * */ runtimeOnly "com.samsthenerd.inline:inline-neoforge:$rootProject.minecraft_version-$rootProject.inline_version"

    //Inline dependency
    /*Cloth Config  * */ runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"


    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
