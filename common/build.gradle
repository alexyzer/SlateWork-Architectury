architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/slate_work.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version+$rootProject.minecraft_version"

    //HexCasting common
    modImplementation rootProject.files("libs/hexcasting-common-$rootProject.minecraft_version-${rootProject.hexcasting_version}.jar")

    //MoreIotas (old version for API)
    modImplementation("ram.talia.moreiotas:moreiotas-fabric-1.20.1:0.1.1") {
        //Prevent old dependency pollution
        transitive = false
    }

    //Trinkets (optional support)
    modImplementation "dev.emi:trinkets:$rootProject.trinkets_version"

    //Cloth Config common
    modImplementation("me.shedaniel.cloth:cloth-config:$rootProject.cloth_config_version")
}
